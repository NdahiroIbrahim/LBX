<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBX - Join the Waitlist</title>
    <link rel="stylesheet" href="signup-style.css">
</head>
<body>
    <div class="container">
        <h2 class="title-text">Join the LBEx Waitlist</h2>
        <p class="desc-text">Be among the first to trade and invest in local businesses with LBEx.</p>
        <form id="waitlistForm">
            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" required>
            </div>
            
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>

            <button type="submit" class="submit-btn">Join Now</button>
        </form>

        <p id="message"></p>

        <p class="link-text">Want to tokenize your business? <a href="business-waitlist.html">Register your business to the waitlist</a></p>

    </div>

    <script>
document.getElementById("waitlistForm").addEventListener("submit", function(event) {
    event.preventDefault();
    alert("Form submitted!");

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;

    fetch("https://lbex-backend.onrender.com/waitlist", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"  
        },
        body: JSON.stringify({ name, email })  
    })
    .then(response => response.json())
    .then(data => {
        const message = document.getElementById("message");
        if (data.error) {
            message.innerText = `Error: ${data.error}`;
            message.className = "message error";
        } else {
            message.innerText = "Successfully added to waitlist!";
            message.className = "message success";
            document.getElementById("waitlistForm").reset();
            setTimeout(() => {
                window.location.href = "thankyou.html";
            }, 2000);
        }
    })
    .catch(error => {
        const message = document.getElementById("message");
        message.innerText = "Something went wrong. Please try again.";
        message.className = "message error";
    });
});
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBX - Join the Waitlist</title>
    <link rel="stylesheet" href="signup-style.css">
</head>
<body>
    <div class="container">
        <h2>Join the LBX Waitlist</h2>
        <p>Be the first to invest in trusted local businesses.</p>
        <form id="waitlistForm">
            <div class="input-group">
                <label for="name">Name:</label>
                <input type="text" id="name" required>
            </div>
            
            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>

            <button type="submit" class="submit-btn">Join Now</button>
        </form>

        <p id="message"></p>
    </div>

    <script>
document.getElementById("waitlistForm").addEventListener("submit", function(event) {
    event.preventDefault();
    alert("Form submitted!");

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;

    fetch("http://127.0.0.1:5000/waitlist", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"  
        },
        body: JSON.stringify({ name, email })  
    })
    .then(response => response.json())
    .then(data => {
        const message = document.getElementById("message");
        if (data.error) {
            message.innerText = `Error: ${data.error}`;
            message.className = "message error";
        } else {
            message.innerText = "Successfully added to waitlist!";
            message.className = "message success";
            document.getElementById("waitlistForm").reset();
            setTimeout(() => {
                window.location.href = "thankyou.html";
            }, 2000);
        }
    })
    .catch(error => {
        const message = document.getElementById("message");
        message.innerText = "Something went wrong. Please try again.";
        message.className = "message error";
    });
});
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBEx - Join Waitlist</title>
    <link rel="stylesheet" href="./signup-style.css">
</head>
<body>
    <h2>Join the LBEx Waitlist</h2>
    <form id="waitlistForm">
        <label for="name">Name:</label>
        <input type="text" id="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email"><br><br>

        <button type="submit">Join Now</button>
    </form>

    <p id="message"></p>

    <script>
document.getElementById("waitlistForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;

    fetch("http://127.0.0.1:5000/waitlist", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"  
        },
        body: JSON.stringify({ name, email})  
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            document.getElementById("message").innerText = `Error: ${data.error}`;
        } else {
            document.getElementById("message").innerText = "Successfully added to waitlist!";
            document.getElementById("waitlistForm").reset();
            setTimeout(() => {
                window.location.href = "thankyou.html";
            }, 2000);
        }
    })
    .catch(error => {
        document.getElementById("message").innerText = "Something went wrong. Please try again.";
    });
});

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBX - Join the Waitlist</title>
    <link rel="stylesheet" href="signup-style.css">
    <link rel="icon" type="image/x-icon" href="/assets/favicon_io (2)/favicon-32x32.png">
</head>
<script src="waitlist.js"></script>
<body>
    <div class="container">
        <h2 class="title-text">Join the LBEx Waitlist</h2>
        <p class="desc-text">Be among the first to trade and invest in local businesses with LBEx.</p>
        <form id="waitlistForm">
            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" required>
            </div>
            
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>

            <button type="submit" class="submit-btn">Join Now</button>
        </form>

        <p id="message"></p>

        <p class="link-text">Want to tokenize your business? <a href="business-waitlist.html">Register your business to the waitlist</a></p>

    </div>

 </body>
</html>
